name: GBAX Android baseline

on:
  workflow_dispatch:
  push:
    branches:
      - 'feat/gbax-*'
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: gbax-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  savx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test 16 MiB persistent storage format
        run: |
          cc -O2 -g -std=c99 -Wall -Wextra -Werror -fsanitize=address,undefined -Iinclude src/gba/gbax-savx.c tools/gbax-savx-test.c -o /tmp/gbax-savx-test
          /tmp/gbax-savx-test
  guest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libcmocka-dev libpng-dev zlib1g-dev
      - name: Assemble original diagnostic ROM
        run: |
          mkdir -p build-diagnostic
          arm-none-eabi-as -mcpu=arm7tdmi tools/gbax-guest-test.s -o build-diagnostic/guest.o
          arm-none-eabi-ld -Ttext=0x08000000 -e _start build-diagnostic/guest.o -o build-diagnostic/guest.elf
          arm-none-eabi-objcopy -O binary build-diagnostic/guest.elf build-diagnostic/gbax-ram64-test.gba
          python3 tools/gbax-fix-header.py build-diagnostic/gbax-ram64-test.gba
      - name: Build C SDK diagnostic cartridge
        run: |
          arm-none-eabi-gcc -mcpu=arm7tdmi -marm -O2 -ffreestanding -fno-builtin -Wall -Wextra -Werror -I sdk -I include/mgba/internal/gba -c tools/gbax-sdk-test.c -o build-diagnostic/sdk.o
          arm-none-eabi-as -mcpu=arm7tdmi tools/gbax-sdk-start.s -o build-diagnostic/sdk-start.o
          arm-none-eabi-gcc -mcpu=arm7tdmi -marm -nostdlib -Wl,-T,tools/gbax-sdk-test.ld build-diagnostic/sdk-start.o build-diagnostic/sdk.o -lgcc -o build-diagnostic/sdk.elf
          arm-none-eabi-objcopy -O binary build-diagnostic/sdk.elf build-diagnostic/sdk.gba
          python3 tools/gbax-fix-header.py build-diagnostic/sdk.gba
          mkdir -p build-diagnostic/sdk-integration
          python3 tools/gbax-rom128-test.py build-diagnostic/sdk.gba build-diagnostic/sdk-integration/sdk128.gba
          python3 -c 'from pathlib import Path; p=bytearray(Path("build-diagnostic/sdk.gba").read_bytes()); p[0xa0]=78; p[0xbd]=(-sum(p[0xa0:0xbd])-0x19)&255; Path("build-diagnostic/sdk-legacy.gba").write_bytes(p)'
      - name: Build native mGBA and guest regression
        run: |
          cmake -S . -B build-gbax -DBUILD_QT=OFF -DBUILD_SDL=OFF -DBUILD_GL=OFF -DBUILD_GLES2=OFF -DBUILD_GLES3=OFF -DBUILD_SUITE=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-gbax --target test-gba-core -j2
      - name: Execute ARM and Thumb on emulated CPU
        env:
          GBAX_TEST_ROM: ${{ github.workspace }}/build-diagnostic/gbax-ram64-test.gba
        run: |
          test -s "$GBAX_TEST_ROM"
          mkdir -p build-diagnostic/savx-integration
          export GBAX_SAVX_TEST_ROM="$PWD/build-diagnostic/savx-integration/persistent.gba"
          cp "$GBAX_TEST_ROM" "$GBAX_SAVX_TEST_ROM"
          export GBAX_SDK_TEST_ROM="$PWD/build-diagnostic/sdk-integration/sdk128.gba"
          export GBAX_SDK_LEGACY_ROM="$PWD/build-diagnostic/sdk-legacy.gba"
          export GBAX_ROM128_TEST="$PWD/build-diagnostic/rom128-test.gba"
          python3 tools/gbax-rom128-test.py "$GBAX_TEST_ROM" "$GBAX_ROM128_TEST"
          runner="$(find build-gbax -type f -name test-gba-core -print -quit)"
          test -n "$runner"
          "$runner"
          test "$(stat -c %s build-diagnostic/savx-integration/persistent.savx.0)" = 16777252
          test "$(stat -c %s build-diagnostic/savx-integration/persistent.savx.1)" = 16777252
      - name: Build native Libretro core
        run: |
          cmake -S . -B build-libretro -DBUILD_LIBRETRO=ON -DSKIP_LIBRARY=ON -DBUILD_QT=OFF -DBUILD_SDL=OFF -DBUILD_GL=OFF -DBUILD_GLES2=OFF -DBUILD_GLES3=OFF -DDISABLE_DEPS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-libretro --target mgba_libretro -j2
      - name: Test independent GBA turbo input pulses
        run: |
          cc -std=c99 -Wall -Wextra -Werror -I src/platform/libretro tools/gbax-turbo-input-test.c -o /tmp/gbax-turbo-input-test
          /tmp/gbax-turbo-input-test
      - name: Verify read-only cache rewind optimization
        run: |
          python3 - <<'PYTEST'
          import pathlib, shlex, subprocess
          line = next(l for l in pathlib.Path("build-libretro/CMakeFiles/mgba_libretro.dir/flags.make").read_text().splitlines() if l.startswith("C_DEFINES ="))
          defines = shlex.split(line.partition("=")[2])
          subprocess.run(["cc", "-O2", "-std=c11", *defines, "-Iinclude", "-Ibuild-libretro/include", "tools/gbax-rewind-cache-test.c", "-Lbuild-libretro", "-Wl,-rpath," + str(pathlib.Path("build-libretro").resolve()), "-l:mgba_libretro.so", "-o", "/tmp/gbax-rewind-cache-test"], check=True)
          subprocess.run(["/tmp/gbax-rewind-cache-test", "build-diagnostic/sdk.gba"], check=True)
          PYTEST
      - name: Execute Libretro SDK persistence and state envelope test
        run: |
          LIB="$(find build-libretro -name mgba_libretro.so -print -quit)"
          test -s "$LIB"
          python3 tools/gbax-libretro-test.py "$LIB" build-diagnostic/sdk-integration/sdk128.gba build-diagnostic/sdk-legacy.gba
      - uses: actions/upload-artifact@v4
        with:
          name: gbax-sdk-v1
          path: |
            sdk/gbax.h
            include/mgba/internal/gba/gbax-abi.h
            docs/gbax-sdk.md
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: gbax-ram64-diagnostic-rom
          path: build-diagnostic/gbax-ram64-test.gba
          if-no-files-found: error
          retention-days: 7
  android:
    needs: [guest, savx]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Test GBAX sparse memory
        run: |
          cc -std=c99 -Wall -Wextra -Werror -fsanitize=address,undefined -Iinclude tools/gbax-memory-test.c -o /tmp/gbax-test
          /tmp/gbax-test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.3.11579264 cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Restore debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: gbax-debug-key-${{ github.repository }}-v1
      - name: Fetch SDL2
        run: git clone --depth 1 --branch release-2.30.9 https://github.com/libsdl-org/SDL.git "$RUNNER_TEMP/SDL2"
      - name: Build debug APK
        working-directory: src/platform/android
        env:
          SDL2_SRC: ${{ runner.temp }}/SDL2
          APP_VERSION_CODE: ${{ github.run_number }}
          ANDROID_SDK_HOME: /home/runner
        run: bash ./build-apk.sh
      - name: Verify APK signature and package
        run: |
          APK=src/platform/android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | head -n 12
          sha256sum "$APK" > "$APK.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: gbax-android-arm64-debug
          path: |
            src/platform/android/app/build/outputs/apk/debug/app-debug.apk
            src/platform/android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7
